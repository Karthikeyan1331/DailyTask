openapi: 3.0.0

info:
  title: Stories API
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'
    description: 'Books'
  - url: 'http://localhost:8000/food'
    description: 'Food Recip'
components:
  examples:
    exampleArray:
      value:
        - action
        - comedy
  schemas:
    Story:
      type: object
      x-hidden: true
      properties:
        title:
          type: string
        author:
          type: string
        category:
          type: array
          items:
            type: string
          example: ["hello", "world"]
      required:
        - title
        - author
        - category

    
  responses:
    NotFound:
      description: Story not found
    InternalServerError1:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal server error occurred."

paths:
  /stories/{id}:
    put:
      summary: Update a story by ID
      tags:
        - Stories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the story to update
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Story'
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError1'
    get:
      summary: Get a story by ID
      tags:
        - Stories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the story to retrieve
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError1'
    delete:
      summary: Delete a story by ID
      tags:
        - Stories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the story to delete
      responses:
        '200':
          description: Successful deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError1'
  /stories:
    get:
      summary: Retrieve a list of stories
      tags:
        - Stories
      responses:
        '200':
          description: A list of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'
        '500':
          $ref: '#/components/responses/InternalServerError1'
    post:
      summary: Create a new story
      tags:
        - Stories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Story'
      responses:
        '201':
          description: Story created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '500':
          $ref: '#/components/responses/InternalServerError1'
