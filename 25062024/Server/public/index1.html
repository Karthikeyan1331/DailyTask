<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger UI</title>
    <!-- Load Swagger UI CSS -->
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .select-api {
            position: absolute;
            top: 24%;
            left: 80%;
            width: 20vw;
            transform: translate(-50%, -50%);
        }

        #swagger-ui {
            min-height: 80vh;
        }
    </style>
</head>

<body>
    <!-- Select box for API selection -->
    <select id="api-select" class="select-api form-select" size="1" aria-label="size 1 select example">
        <!-- Options will be populated by JavaScript -->
    </select>
    <!-- Container for Swagger UI -->
    <div id="swagger-ui"></div>

    <!-- Load Swagger UI JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>

    <script>
        // Function to initialize Swagger UI with the selected API
        function initSwagger(api) {
            console.log(api,SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset)
            const ui = SwaggerUIBundle({
                url: `/swagger.json?api=${api}`,
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],

                layout: 'BaseLayout',
                deepLinking: true
            });

            window.ui = ui;
        }
        const currentUrl = window.location.href.split("/").slice(-2)[0];
        initSwagger(currentUrl)
        // Function to populate the select box with options
        async function populateSelectBox() {
            const response = await fetch('/api-options');
            const options = await response.json();

            const selectBox = document.getElementById('api-select');
            selectBox.innerHTML = ''; // Clear any existing options

            Object.entries(options).forEach(([value, text]) => {

                const option = document.createElement('option');
                option.value = value;
                option.textContent = text;
                if (value === currentUrl) {
                    option.setAttribute("selected", "selected");
                }
                selectBox.appendChild(option);
            });
        }

        // Event listener for select box change
        document.getElementById('api-select').addEventListener('change', function (event) {
            const selectedApi = event.target.value;
            history.pushState(null, null, `/api-docs/${selectedApi}`);
            initSwagger(selectedApi); // Reload Swagger UI with the selected API
        });

        // Populate the select box on page load
        populateSelectBox();
    </script>
</body>

</html>
